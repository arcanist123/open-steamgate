# The same check the pre-commit hook runs, where it cannot be skipped.
#
# A hook lives in a clone. It is absent on a fresh one, absent for anybody who
# has not run `git config core.hooksPath .githooks`, and gone the moment
# somebody passes --no-verify. None of that is a reason not to have the hook —
# it is the fast feedback — but it is the reason this file exists.
name: leak scan

on:
  push:
  pull_request:

# A newer push to a pull request supersedes its run; pushes elsewhere are
# never cancelled (the same rule as tests.yml, #602).
concurrency:
  group: leak-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The identifier list is gitignored, so it reaches the runner only as the
      # OSD_LEAK_IDENTIFIERS Actions secret (the one release.yml reads). The log of a public repository is
      # public, so every name and category is registered with ::add-mask::
      # before anything runs, and the scan prints a category number and a
      # hash instead of the value (--redact). Without the secret (a pull
      # request from a fork gets none) the structural rules still run, and
      # the job says plainly that the names were not checked: exit 2 means
      # "ran without the names", not "clean".
      #
      # A secret is readable by code running in this repository, so whoever
      # can push a branch here could print it from that branch. Today only the
      # owner can (checked 2026-10-01: one collaborator, oisee), and that
      # account already holds the list. If a collaborator is ever added, move
      # the secret into an environment whose deployment policy allows main only.
      - name: install the identifier list
        env:
          LEAK_IDENTIFIERS: ${{ secrets.OSD_LEAK_IDENTIFIERS }}
        run: |
          if [ -z "$LEAK_IDENTIFIERS" ]; then
            echo "::warning::OSD_LEAK_IDENTIFIERS is not available to this run: names are NOT checked, only the structural rules"
            exit 0
          fi
          umask 077
          mkdir -p .local
          printf '%s' "$LEAK_IDENTIFIERS" > .local/leak-identifiers.json
          node tools/osd-leak-scan.mjs --print-masks
      - name: scan every tracked file
        run: |
          node tools/osd-leak-scan.mjs . --all --redact || [ $? -eq 2 ]
      - name: remove the identifier list
        if: always()
        run: rm -f .local/leak-identifiers.json
      # The naming rule (G.1d), here for the same reason the leak scan is: a
      # rule that lives in a document is read once and then goes stale in
      # silence. This one needs no identifier list, so it either passes or
      # names the position it failed in.
      - name: the naming rule
        run: node tools/osd-naming-scan.mjs
      # What a system refuses to store (OO_SOURCE_BASED 012): a comment line
      # between the parts of a class implementation. It builds and runs here
      # and fails the last mile, so it is checked where the naming rule is.
      # The only dependency is the parser, pinned as package.json pins it.
      - name: comments outside methods in class implementations
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @abaplint/core@2.120.94
          node tools/osd-oo-comments.mjs
      # A field a system refuses to activate because its name is a reserved
      # word (RULE in ZOSD_L3_ALERT, A4H 2026-10-01). The public list is
      # tracked; a system's own list is never on a runner, so only the
      # public check runs here, after the step above has installed the deps.
      - name: reserved words as table field names
        run: node tools/osd-ddic-reserved.mjs
