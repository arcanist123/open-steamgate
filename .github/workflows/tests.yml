name: tests

# The suites, read by something other than a person.
#
# Written 2026-09-19 after an independent review pointed at a hole nobody
# had looked in: this repository had **1020 wire tests, 159 ABAP unit
# methods and a clean lint, and no workflow that read any of them**.
# `leak-scan.yml` reads what is about to be published and `preview.yml`
# builds the browser deployment and checks it; neither runs a test.
#
# What that cost, measured rather than imagined: `test/segw-tree.mjs` was
# **3 failing on the published branch** before that evening and **8 after**
# it, across a push cycle, and nothing said so. The invariant it holds is
# not a small one — the ABAP generator and the Node generator write the
# same bytes — and it is the guarantee the whole SEGW-in-ABAP track rests
# on.
#
# This tree's own rule is "an instrument that cannot go red is
# indistinguishable from a broken one". It had been applied to every
# instrument except the suite.
#
# Both workflows load their source refs from libs.lock.json through
# tools/osd-lock.mjs, so neither job carries a second copy of the pins.

on:
  pull_request:
  push:
    branches: [main]
    tags: [vscode-v*, vscode-stable-v*]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

# **`pipefail`, and it is not paranoia.** A `run:` step without a `shell:`
# key runs under `bash -e {0}` — `-e`, and **no** `pipefail`. So a step that
# pipes anything reports the status of the last stage of the pipe, and a
# failing suite piped into `tee` or `tail` is a green step. That is not
# hypothetical: the author of this file did exactly that from a terminal an
# hour before writing it (`node tools/osd-suites.mjs | tail -6` → exit 0,
# tail's), and fable-osd pointed out that the same trap fits in here.
#
# `shell: bash` is GitHub's own alias for `bash --noprofile --norc -eo
# pipefail {0}`. Setting it once for the job closes the class instead of
# checking each step for pipes, which is the difference between a rule and a
# habit.
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    outputs:
      vsix_profile: ${{ steps.vsix_profile.outputs.profile }}
      adt_lifecycle: ${{ steps.adt_lifecycle.outputs.adt_lifecycle }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the feature map
        run: |
          npm run where
          git diff --exit-code -- docs/where-is.md
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"

      # **The binary builds from a checkout, before anything is generated.**
      # `npm run binary` bundles bin/osd.mjs and everything it reaches, and
      # twice it reached a file only another build writes: gen/ (a static
      # import of gen/osd-ddic-binary.mjs in test/setup.mjs) and
      # web/generated/amdp.mjs (written by the preview build). On a
      # workstation both are left over and the build is green; here, before
      # the transpile step, they do not exist, which is the state a fresh
      # clone is in. Built outside build/ so the suites' runtime cases of
      # test/osd-binary.mjs stay as they were; `doctor` checks what the
      # bundle did to the runtime's class names.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build the binary from the clean checkout
        run: |
          bun scripts/build-binary.mjs "$RUNNER_TEMP/osd"
          "$RUNNER_TEMP/osd" doctor

      # libs.lock.json includes the pinned repository and commit. Hashing the
      # build script invalidates compiled output when its commands change.
      # Outside the checkout, and absolute: actions/cache silently refuses to
      # save a path with ".." in it ("Relative pathing '.' and '..' is not
      # allowed"), which is how the first version of this cache never hit.
      - name: Where the pinned transpiler lives
        run: echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
      - name: Restore the pinned transpiler build
        id: transpiler_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/transpiler
          key: transpiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('libs.lock.json') }}-${{ hashFiles('tools/osd-ci-transpiler-build.sh') }}
      - name: Build the transpiler this tree is pinned to
        if: steps.transpiler_cache.outputs.cache-hit != 'true'
        run: bash tools/osd-ci-transpiler-build.sh build
      - name: Verify and link the pinned transpiler
        run: |
          bash tools/osd-ci-transpiler-build.sh verify
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-transpiler.mjs

      # The build refuses a pack that was not fetched, so this is not
      # optional: without it the suites would run against a smaller system
      # than the manifests describe and look complete.
      - name: Fetch the pack sources
        run: node tools/osd-fetch.mjs

      # **The library folders, from the config rather than from a list here.**
      # The transpiler falls back to a lib's url and clones into a temporary
      # directory, so a BUILD on a clean machine works. The object store does
      # not: it reads `lib.folder` off the disk, and a folder that is not
      # there is a library its registry does not have. Four of the six were
      # missing on this runner, and it came back as twelve failures that
      # looked like twelve different things -- "RAISE, unknown class
      # /iwbep/cx_mgw_busi_exception", a check run that never reached
      # `processed`, an activation that never reported activationExecuted.
      #
      # It checks the full list and exact refs from libs.lock.json and leaves
      # matching clones untouched.
      - name: The library folders the object store reads
        run: |
          node tools/osd-libs.mjs
          node tools/osd-libs.mjs --check

      # **Transpile first, and the order is load-bearing.** `npm run lint`
      # analyses `src/` **and `gen/`**, and `gen/` is written by the
      # transpile step: the SEGW registry, the search-help registry, the RFC
      # dispatcher, the transaction registry, the BSP registry. On a
      # workstation that directory is left over from the last run, so lint is
      # green there; on a clean runner it does not exist and lint reports 46
      # errors of the form "Class zcl_stg_bsp_registry not found".
      #
      # This workflow was written on 2026-09-19 to close the hole that
      # nothing read the suites, and it then failed on this step **six runs
      # in a row** without anybody looking at why -- including the run of the
      # commit that announced it. A check that has never been green is not
      # yet an instrument, and "CI reads the tests now" was a claim about a
      # file rather than about a result.
      - name: Transpile
        run: npm run transpile

      - name: Standalone Linux x64 binary starts without the checkout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor;
          # bubblewrap needs them to hide the checkout from the binary under test.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bun scripts/build-binary.mjs --seed "$RUNNER_TEMP/osd-standalone" bun-linux-x64-baseline
          node scripts/smoke-binary.mjs "$RUNNER_TEMP/osd-standalone"

      - run: npm run lint

      - name: ABAP Unit
        run: node tools/osd-unit-run.mjs

      - name: BAL survives an OSD process restart
        run: npm run test:bal-persist

      # Artifact belongs to this run, not to a generation-hash cache. Tar
      # preserves the live/output links and executable modes that Actions
      # artifacts would discard. The clone is relocated inside the checkout
      # so npm ci in consumers supplies its package dependencies. Core must
      # travel with the clone: the fork may differ from npm's @abaplint/core.
      - name: Pack the built tree
        run: |
          mkdir -p .local/ci-artifact
          tar -C "$RUNNER_TEMP" --exclude='node_modules' -cf - transpiler | tar -C .local/ci-artifact -xf -
          mkdir -p .local/ci-artifact/transpiler/packages/transpiler/node_modules/@abaplint
          cp -a "$RUNNER_TEMP/transpiler/packages/transpiler/node_modules/@abaplint/core" .local/ci-artifact/transpiler/packages/transpiler/node_modules/@abaplint/core
          node tools/osd-ci-artifact.mjs pack "$RUNNER_TEMP/built-tree.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}/built-tree.tar
          if-no-files-found: error
          retention-days: 1

      - name: Select VSIX test profile
        id: vsix_profile
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/* ]]; then
            profile=full
            echo 'VSIX profile: full (scheduled, manual, or tag)' >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              base='${{ github.event.pull_request.base.sha }}'
            else
              base='${{ github.event.before }}'
            fi
            if [[ "$base" =~ ^0+$ ]]; then
              profile=full
            else
              git fetch --no-tags --depth=1 origin "$base"
              decision="$(node tools/osd-ci-vsix-profile.mjs "$base" "$(git rev-parse HEAD)")"
              case "$decision" in
                OSD_CI_FULL_VSIX=1) profile=full ;;
                OSD_CI_FULL_VSIX=0) profile=fast ;;
                *) echo "unexpected VSIX profile decision: $decision" >&2; exit 1 ;;
              esac
            fi
            echo "VSIX profile: $profile" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      # Same shape as the VSIX profile above, for the ADT lifecycle job:
      # scheduled, manual, tag and main-push runs always measure; a PR runs
      # the measurements only when the diff reaches an ADT-relevant path.
      - name: Select ADT lifecycle profile
        id: adt_lifecycle
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/* ]]; then
            adt_lifecycle=run
            echo 'ADT lifecycle: run (scheduled, manual, or tag)' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            if [[ "$base" =~ ^0+$ ]]; then
              adt_lifecycle=run
            else
              git fetch --no-tags --depth=1 origin "$base"
              decision="$(node tools/osd-ci-lifecycle-gate.mjs "$base" "$(git rev-parse HEAD)")"
              case "$decision" in
                OSD_CI_ADT_LIFECYCLE=1) adt_lifecycle=run ;;
                OSD_CI_ADT_LIFECYCLE=0) adt_lifecycle=skip ;;
                *) echo "unexpected ADT lifecycle decision: $decision" >&2; exit 1 ;;
              esac
            fi
            echo "ADT lifecycle: $adt_lifecycle" >> "$GITHUB_STEP_SUMMARY"
          else
            # Push to main: the branch protection baseline must stay measured.
            adt_lifecycle=run
            echo 'ADT lifecycle: run (push)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "adt_lifecycle=$adt_lifecycle" >> "$GITHUB_OUTPUT"

  suites:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore and verify this run's build
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          test -f gen/osd-ddic-binary.mjs
          test -f output/init.mjs
          test -f build/live/manifest.json
          test -d .local/lars/open-abap-core
          test -f .local/ci-artifact/transpiler/packages/transpiler/build/src/index.js
          echo "TRANSPILER=$PWD/.local/ci-artifact/transpiler" >> "$GITHUB_ENV"
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler-cli packages/cli
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-ci-artifact.mjs verify
      # **What is skipped is reported, not swallowed.** Several suites are
      # guarded on `.local/corpus*`, which is not in this repository and
      # never will be — it holds real customer projects. On a runner those
      # cases skip, and a run that skips them is a *narrower* run and not a
      # green one. `--report-skips` prints what did not execute and why, so
      # "passed" here and "passed" on a workstation are different claims
      # that say which they are.
      - name: The suites, shard ${{ matrix.shard }}/6
        run: node tools/osd-suites.mjs --report-skips --shard "${{ matrix.shard }}/6" --timings suite-results/timings.json --report suite-results/flaky.md
        env:
          STG_PORT: "3030"
      - name: Upload suite timings and retry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: suite-results/
          if-no-files-found: warn

  packaging:
    needs: build
    if: needs.build.outputs.vsix_profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore and verify this run's build
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          test -f gen/osd-ddic-binary.mjs
          test -f output/init.mjs
          test -f build/live/manifest.json
          test -d .local/lars/open-abap-core
          test -f .local/ci-artifact/transpiler/packages/transpiler/build/src/index.js
          echo "TRANSPILER=$PWD/.local/ci-artifact/transpiler" >> "$GITHUB_ENV"
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler-cli packages/cli
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-ci-artifact.mjs verify
      - name: VSIX packaging group
        run: node tools/osd-suites.mjs --report-skips --group packaging
        env:
          STG_PORT: "3030"

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore and verify this run's build
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          test -f gen/osd-ddic-binary.mjs
          test -f output/init.mjs
          test -f build/live/manifest.json
          test -d .local/lars/open-abap-core
          test -f .local/ci-artifact/transpiler/packages/transpiler/build/src/index.js
          echo "TRANSPILER=$PWD/.local/ci-artifact/transpiler" >> "$GITHUB_ENV"
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler-cli packages/cli
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-ci-artifact.mjs verify
      # Keep the launchpad's core intents covered on the live Node shape
      # as well as in preview.yml's static Pages check.  This comes after the
      # build, so a broken build fails before browser work;
      # preview.yml remains an independent job and only publishes after its
      # own browser check succeeds.
      - name: Read the installed Playwright version
        id: playwright_version
        run: node -e 'console.log("version=" + require("./package-lock.json").packages["node_modules/@playwright/test"].version)' >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: chromium_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for browser smoke tests
        run: |
          if [[ "${{ steps.chromium_cache.outputs.cache-hit }}" == true ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Launchpad, FCL, taxi F4 and APC smoke tests
        run: node scripts/run-e2e-isolated.mjs test/e2e/launchpad-navigation.spec.mjs test/e2e/fcl.spec.mjs test/e2e/listreport.spec.mjs test/e2e/taxi.spec.mjs test/e2e/zork.spec.mjs test/e2e/lsd.spec.mjs --config playwright.config.mjs

      # This is a different product path from the default SQLite browser
      # smoke: selecting Portable AMDP must execute the original SQLScript
      # through the DuckDB runtime and paint its result, not merely expose an
      # option that later returns HTTP 500.
      - name: Switch Vector Workbench to Portable AMDP on DuckDB
        run: node scripts/run-e2e-isolated.mjs test/e2e/zvdb.spec.mjs --config playwright.config.mjs
        env:
          STG_DB: duckdb

  # **OSGo, the Go host of OSG, answers one request** (tools/gogen, part b):
  # every object of this build's tree compiled to Go, the packages of the
  # host vetted and tested, and one request through ZCL_STG_DISPATCHER that
  # must answer 200 with the demo's entity sets. From the build job's tree,
  # so the pinned transpiler and the fetched packs are the suites' own
  # (osg-build.mjs refuses an unfetched pack). OSG's suites against OSGo are
  # osgo-parity in gogen.yml, on request.
  osgo-host:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gogen/go/go.sum
      # The osgo build runs with GOPROXY=off, so every module cmd/osgo imports
      # must be in the cache first; a go.sum change misses the restored cache.
      - name: Download Go modules
        working-directory: tools/gogen/go
        run: go mod download
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore and verify this run's build
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          test -f build/live/manifest.json
          test -d .local/lars/open-abap-core
          test -f .local/ci-artifact/transpiler/packages/transpiler/build/src/index.js
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-ci-artifact.mjs verify
      - name: Go vet and tests of the host packages
        working-directory: tools/gogen/go
        run: |
          go vet ./apc/ ./cmd/apcprobe/ ./cmd/storecmp/
          go test ./apc/...
      - name: Media rows
        run: node --test tools/gogen/media.test.mjs
      - name: One request of OSG's gateway through Go
        run: |
          out=$(node tools/gogen/gateway.mjs) || { echo "$out"; exit 1; }
          echo "$out"
          grep -q '^200 OK$' <<<"$out"
          grep -q '"EntitySets":\["TravelSet"' <<<"$out"
      # ADT conformance on osgo (docs/adt-conformance.md, "CI"): the same case
      # list the required JS suite runs, against the osgo binary with -adt.
      # Known gaps are data in expected/osgo.json and never block. The ratchet:
      # a case expected to pass that fails, or a known gap that passes
      # unannounced (runner exit 1), fails this job and so the required test.
      # A build, start or transport failure (exit 2, no report) fails only once
      # osgo.json holds a pass; before that it is a warning, because nothing
      # it could have proven is lost.
      # Last step in this job: stages fixtures and rebuilds, mutating the tree.
      - name: ADT conformance on osgo (known gaps advisory, passes ratcheted)
        run: |
          port=$(node --input-type=module -e '
            import net from "node:net";
            const server = net.createServer();
            server.listen(0, "127.0.0.1", () => {
              const {port} = server.address();
              server.close(() => console.log(port));
            });
          ')
          export STG_PORT="$port"
          set +e
          expected=test/adt-conformance/expected/osgo.json
          has_pass=$(node -e 'const e=require("./"+process.argv[1]);process.stdout.write(Object.values(e.cases??e).some(v=>String(v).trim()==="pass")?"1":"0")' "$expected")
          infra() {
            if [[ "$has_pass" == 1 ]]; then echo "::error::osgo ADT conformance: $1, and osgo.json expects passes"; exit 1; fi
            echo "::warning::osgo ADT conformance: $1 (advisory while osgo.json holds no pass)"; exit 0
          }
          # Share fixture staging, transpile, compiler launcher and Go build
          # with the manual ABAP-FS recipe; the script stops on any failure.
          sh tools/abapfs-osgo.sh --setup-only || infra "the osgo conformance setup failed"
          node tools/osd-adt-gogen-gate.mjs tools/gogen/.out/osgo-compile-report.json tools/osd-adt-gogen-allowlist.json || exit 1
          tools/gogen/.out/osgo -adt -port "$STG_PORT" -root "$PWD" > "$RUNNER_TEMP/osgo-adt.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "http://127.0.0.1:$STG_PORT/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$STG_PORT/health" >/dev/null 2>&1 || { kill "$pid" 2>/dev/null; tail -20 "$RUNNER_TEMP/osgo-adt.log"; infra "osgo did not answer /health"; }
          node test/adt-conformance/run.mjs --target osgo --base "http://127.0.0.1:$STG_PORT" --expected "$expected" --write-package '$ADT_WRITES'
          rc=$?
          case "$rc" in
            0) echo "osgo ADT conformance: expectations met" ;;
            1) echo "::error::osgo ADT conformance: a case expected to pass failed, or a known gap passed unannounced"; exit 1 ;;
            *) infra "the runner could not run (exit $rc)" ;;
          esac
          # The harness installs its own integrity-pinned client with npm ci.
          # Group selection and strict ratchet policy live in expected-osgo.json.
          node tools/abapfs-conformance.mjs --url "http://127.0.0.1:$STG_PORT" --expected test/fixtures/abapfs-conformance/expected-osgo.json --out .local/conformance/abapfs-osgo
          abapfs_rc=$?
          cat .local/conformance/abapfs-osgo/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$abapfs_rc"

  # An independent parallel gate; no additional work in the suite shards.
  kernel-conformance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: go1.26.0
      GOFLAGS: -buildvcs=false
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Read the corpus pin
        timeout-minutes: 1
        id: corpus_pin
        run: echo "ref=$(cat .github/ci/abapiti.ref)" >> "$GITHUB_OUTPUT"
      - name: Restore the generated corpus by pin and recipe
        timeout-minutes: 5
        id: corpus_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/kernelci/corpus
          key: kernel-corpus-v1-${{ runner.os }}-${{ steps.corpus_pin.outputs.ref }}-${{ hashFiles('tools/osd-kernel-corpus.mjs', '.github/ci/kernel-corpus.json', 'test/fixtures/osgjs-unit-int8/*') }}
      - name: Validate restored corpus content before deciding whether to fetch source
        timeout-minutes: 1
        id: corpus_validation
        run: node tools/osd-kernel-corpus.mjs --check-cache >> "$GITHUB_OUTPUT"
      - name: Check out public ABAPiti for missing or corrupt corpus inputs
        timeout-minutes: 5
        id: abapiti_checkout
        if: steps.corpus_validation.outputs.regenerate == 'true'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oisee/abapiti
          ref: ${{ steps.corpus_pin.outputs.ref }}
          path: .local/kernelci/abapiti-source
          persist-credentials: false
      - name: Retry failed ABAPiti checkout once
        timeout-minutes: 5
        if: steps.corpus_validation.outputs.regenerate == 'true' && steps.abapiti_checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oisee/abapiti
          ref: ${{ steps.corpus_pin.outputs.ref }}
          path: .local/kernelci/abapiti-source
          persist-credentials: false
      - name: Set up Go for corpus generation and runtime checks
        timeout-minutes: 5
        id: setup_go
        continue-on-error: true
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Retry failed Go setup once
        timeout-minutes: 5
        if: steps.setup_go.outcome == 'failure'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install the corpus C compiler
        timeout-minutes: 5
        if: steps.corpus_validation.outputs.regenerate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          mkdir -p .local/kernelci/clang-bin
          ln -s /usr/bin/clang-18 .local/kernelci/clang-bin/clang
          ln -s /usr/bin/wasm-ld-18 .local/kernelci/clang-bin/wasm-ld
          echo "$PWD/.local/kernelci/clang-bin" >> "$GITHUB_PATH"
      - name: Generate or verify the pinned public inputs
        timeout-minutes: 11
        id: prepare_corpus
        run: node tools/osd-kernel-corpus.mjs --source .local/kernelci/abapiti-source
      - name: Cache verified generated inputs even if runtime conformance later fails
        timeout-minutes: 5
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/kernelci/corpus
          key: ${{ steps.corpus_cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 5
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore this run's pinned runtime and libraries
        timeout-minutes: 5
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          test -d .local/lars/open-abap-core
          test -f .local/ci-artifact/transpiler/packages/transpiler/build/src/index.js
          echo "TRANSPILER=$PWD/.local/ci-artifact/transpiler" >> "$GITHUB_ENV"
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-ci-artifact.mjs verify
      - name: Run required kernel conformance and support drift
        timeout-minutes: 11
        run: OSD_HEAVY_RANGE=50-59 tools/osd-heavy.sh timeout 600s node tools/osd-kernel-conformance.mjs --profile required --source .local/kernelci/abapiti-source
      - name: Publish the conformance summary
        timeout-minutes: 1
        if: always()
        run: |
          if [[ -f .local/kernelci/report/summary.md ]]; then
            cat .local/kernelci/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Kernel conformance failed before producing a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 5
        if: always()
        with:
          name: kernel-conformance-required
          path: |
            .local/kernelci/report/
            .local/kernelci/generate.log
          if-no-files-found: error

  adt-lifecycle:
    needs: build
    if: needs.build.outputs.adt_lifecycle == 'run'
    runs-on: ubuntu-latest
    # Measured 21-24 min on green main runs (2026-10-05/06), so 25 cancelled
    # healthy runs on slower runners. 40 leaves headroom without hiding a hang.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore and verify the build used by the shards
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          echo "TRANSPILER=$PWD/.local/ci-artifact/transpiler" >> "$GITHUB_ENV"
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler-cli packages/cli
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-ci-artifact.mjs verify
      - run: npm ci --prefix tools/abapfs-conformance
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build the public VSP client at its tracked pin
        run: |
          ref="$(cat .github/ci/vsp.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/oisee/vibing-steampunk.git "$RUNNER_TEMP/vsp-source"
          git -C "$RUNNER_TEMP/vsp-source" checkout --detach "$ref"
          [[ "$(git -C "$RUNNER_TEMP/vsp-source" rev-parse HEAD)" == "$ref" ]]
          mkdir -p "$RUNNER_TEMP/vsp-bin"
          cd "$RUNNER_TEMP/vsp-source"
          go build -o "$RUNNER_TEMP/vsp-bin/vsp" ./cmd/vsp
          echo "VSP=$RUNNER_TEMP/vsp-bin/vsp" >> "$GITHUB_ENV"
      - name: Measure creation, edits and activation through both clients
        run: |
          mkdir -p .local/adt-lifecycle/report
          OSD_HEAVY_RANGE=90-99 OSD_HEAVY_SLOTS=4 tools/osd-heavy.sh node tools/adt-lifecycle.mjs --start 2>&1 | tee .local/adt-lifecycle/report/server.log
      # Save the required verdict before any optional network work. A failed
      # measurement still gets its functional report; timing cannot hide it.
      - name: Compute required functional result
        id: functional_report
        if: always()
        run: node tools/adt-lifecycle-report.mjs .local/adt-lifecycle/report/report.json '' .local/adt-lifecycle/report/summary.md
      - name: Collect up to five compatible green main timing runs
        if: success()
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const {pathToFileURL} = require('node:url');
            const {baselineIssue, TIMING_RULE} = await import(pathToFileURL(process.cwd() + '/tools/adt-lifecycle-report.mjs'));
            const current = JSON.parse(fs.readFileSync('.local/adt-lifecycle/report/report.json', 'utf8'));
            const {owner, repo} = context.repo;
            const history = {reports: [], notes: []};
            const skipped = message => { history.notes.push(message); core.info(message); };
            // Leave ten seconds for writing partial history before the step's
            // hard three-minute limit. Each request and unzip shares this budget.
            const started = performance.now();
            const remaining = () => {
              const ms = Math.floor(170000 - (performance.now() - started));
              if (ms <= 0) throw Error('Timing history collection reached its 170-second budget');
              return ms;
            };
            const request = () => {
              const ms = remaining();
              return {timeout:ms, signal:AbortSignal.timeout(ms)};
            };
            try {
              // Bound API work to the latest 30 green main push runs; expired
              // or unavailable artifacts do not consume the five usable slots.
              const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id:'tests.yml', event:'push', branch:'main', status:'success', per_page:30, request:request()});
              for (const run of runs.data.workflow_runs.slice(0, 30)) {
                remaining();
                if (run.id === context.runId) continue;
                try {
                  const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id:run.id, request:request()});
                  const candidates = artifacts.filter(a => /^adt-lifecycle-attempt-\d+$/.test(a.name) && !a.expired)
                    .sort((a,b) => Number(b.name.split('-').at(-1)) - Number(a.name.split('-').at(-1)));
                  for (const artifact of candidates) {
                    remaining();
                    try {
                      const zip = await github.rest.actions.downloadArtifact({owner, repo, artifact_id:artifact.id, archive_format:'zip', request:request()});
                      const archive = process.env.RUNNER_TEMP + '/lifecycle-baseline.zip';
                      fs.writeFileSync(archive, Buffer.from(zip.data));
                      const unpack = cp.spawnSync('unzip', ['-p', archive, 'report.json'], {encoding:'utf8', timeout:remaining()});
                      if (unpack.status !== 0) throw Error('Unreadable main lifecycle artifact');
                      const base = JSON.parse(unpack.stdout);
                      const issue = baselineIssue(current, base);
                      if (issue) { skipped(`Main run ${run.id}: ${issue}`); continue; }
                      history.reports.push(base);
                      core.info('Using main timing run ' + run.id + ' at ' + run.head_sha);
                      break; // One report per run, even after workflow reruns.
                    } catch (error) {
                      skipped(`Main run ${run.id}, artifact ${artifact.name}: ${error.message}`);
                    }
                  }
                } catch (error) { skipped(`Main run ${run.id}: ${error.message}`); }
                if (history.reports.length === TIMING_RULE.baselines) break;
              }
            } catch (error) { skipped('Main timing history unavailable: ' + error.message); }
            fs.writeFileSync('.local/adt-lifecycle/baselines.json', JSON.stringify(history));
            core.info(`Timing history: ${history.reports.length}/${TIMING_RULE.baselines} compatible green main runs`);
      - name: Report normalized timing advisory and functional result
        # A collector failure/timeout is advisory. The required verdict and
        # fallback summary already exist; retain them if rendering also fails.
        if: ${{ !cancelled() && steps.functional_report.outcome == 'success' }}
        timeout-minutes: 1
        continue-on-error: true
        run: |
          node tools/adt-lifecycle-report.mjs .local/adt-lifecycle/report/report.json .local/adt-lifecycle/baselines.json .local/adt-lifecycle/report/advisory-summary.md
          mv .local/adt-lifecycle/report/advisory-summary.md .local/adt-lifecycle/report/summary.md
      - name: Publish measurements even on failure
        if: always()
        run: |
          if [[ -f .local/adt-lifecycle/report/summary.md ]]; then
            cat .local/adt-lifecycle/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ADT lifecycle failed before producing measurements.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adt-lifecycle-attempt-${{ github.run_attempt }}
          path: .local/adt-lifecycle/report/
          if-no-files-found: error
          retention-days: 30

  test:
    if: always()
    needs: [build, suites, packaging, e2e, osgo-host, kernel-conformance, adt-lifecycle, pr-report]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SUITES_RESULT: ${{ needs.suites.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          OSGO_RESULT: ${{ needs.osgo-host.result }}
          KERNEL_RESULT: ${{ needs.kernel-conformance.result }}
          LIFECYCLE_RESULT: ${{ needs.adt-lifecycle.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
          VSIX_PROFILE: ${{ needs.build.outputs.vsix_profile }}
          ADT_LIFECYCLE: ${{ needs.build.outputs.adt_lifecycle }}
          EVENT_NAME: ${{ github.event_name }}
          REPORT_RESULT: ${{ needs.pr-report.result }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$REPORT_RESULT" == success ]] || exit 1
          fi
          [[ "$BUILD_RESULT" == success && "$SUITES_RESULT" == success && "$E2E_RESULT" == success && "$OSGO_RESULT" == success && "$KERNEL_RESULT" == success ]]
          case "$VSIX_PROFILE:$PACKAGING_RESULT" in
            full:success|fast:skipped) ;;
            *) echo "unexpected VSIX profile/job result: $VSIX_PROFILE:$PACKAGING_RESULT" >&2; exit 1 ;;
          esac
          case "$ADT_LIFECYCLE:$LIFECYCLE_RESULT" in
            run:success|skip:skipped) ;;
            *) echo "unexpected ADT lifecycle gate/job result: $ADT_LIFECYCLE:$LIFECYCLE_RESULT" >&2; exit 1 ;;
          esac

  # One comment per PR with the jobs of this run, kept up to date: the same
  # idea as oisee/minz's PR report and abaplint/transpiler's regression table.
  # A green rollup and a job that never ran look alike in the checks list; a
  # table that names every job, its result and its duration does not. The rows
  # come from this run's own job list, so a new job appears without editing
  # this step. All PRs validate artifacts; only same-repository PRs write comments.
  pr-report:
    if: always() && github.event_name == 'pull_request'
    needs: [build, suites, packaging, e2e, osgo-host, kernel-conformance, adt-lifecycle]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download shard retry reports
        uses: actions/download-artifact@v4
        with:
          pattern: suite-results-*
          path: suite-results
      - name: Download lifecycle measurements
        uses: actions/download-artifact@v4
        with:
          pattern: adt-lifecycle-attempt-*
          path: adt-lifecycle-results
      - name: Update one PR comment with this run's jobs
        uses: actions/github-script@v7
        env:
          EXPECTED_SHARDS: '1,2,3,4,5,6'
          JOB_RESULTS: ${{ toJSON(needs) }}
          VSIX_PROFILE: ${{ needs.build.outputs.vsix_profile }}
          ADT_LIFECYCLE: ${{ needs.build.outputs.adt_lifecycle }}
          CAN_COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            // The matrix above must supply one readable report per shard, even
            // when empty. A missing artifact is missing evidence, never clean.
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT || 1);
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              { owner, repo, run_id: context.runId, attempt_number: attempt });
            const expected = process.env.EXPECTED_SHARDS.split(',');
            const actual = fs.readdirSync('suite-results').sort();
            const reports = [];
            // The ADT lifecycle gate decides whether this PR owes measurements:
            // a skipped gate means no job, no artifact and no error here, and
            // the job row below already shows the skip.
            let lifecycle = '';
            if (process.env.ADT_LIFECYCLE === 'run') {
              const lifecycleDirs = fs.readdirSync('adt-lifecycle-results')
                .filter(dir => /^adt-lifecycle-attempt-\d+$/.test(dir) && Number(dir.split('-').at(-1)) <= attempt)
                .sort((a,b) => Number(a.split('-').at(-1)) - Number(b.split('-').at(-1)));
              const lifecycleDir = lifecycleDirs.at(-1);
              if (!lifecycleDir || (jobs.some(j => j.name === 'adt-lifecycle') && lifecycleDir !== `adt-lifecycle-attempt-${attempt}`)) throw Error('Missing current lifecycle measurements');
              lifecycle = fs.readFileSync(path.join('adt-lifecycle-results', lifecycleDir, 'summary.md'), 'utf8').trim();
              if (!lifecycle) throw Error('Missing lifecycle measurements');
            } else if (process.env.ADT_LIFECYCLE === 'skip') {
              lifecycle = '_ADT lifecycle skipped: no ADT-relevant paths in this change set._';
            } else {
              throw new Error(`Unexpected ADT lifecycle gate: ${process.env.ADT_LIFECYCLE}`);
            }
            for (const shard of expected) {
              // Re-run failed jobs retains successful shards from older attempts.
              const retained = actual.map((dir) => {
                const match = dir.match(/^suite-results-(\d+)-attempt-(\d+)$/);
                return match && match[1] === shard && Number(match[2]) <= attempt
                  ? { dir, attempt: Number(match[2]) } : null;
              }).filter(Boolean).sort((a, b) => a.attempt - b.attempt);
              if (!retained.length) throw new Error(`Expected shard report ${shard}; got ${actual.join(', ')}`);
              if (jobs.some((job) => job.name === `suites (${shard})`) && retained.at(-1).attempt !== attempt) {
                throw new Error(`Missing current-attempt shard report ${shard}`);
              }
              for (const { dir } of retained) {
                const report = fs.readFileSync(path.join('suite-results', dir, 'flaky.md'), 'utf8').trim();
                if (report) reports.push(report);
              }
            }
            const results = JSON.parse(process.env.JOB_RESULTS);
            const required = ['build', 'suites', 'e2e', 'osgo-host', 'kernel-conformance'];
            for (const job of [...required, 'adt-lifecycle', 'packaging']) {
              if (!results[job]?.result) throw new Error(`Missing required job result: ${job}`);
            }
            const gatePassed = required.every((job) => results[job].result === 'success') &&
              (process.env.VSIX_PROFILE === 'full' ? results.packaging.result === 'success' :
                process.env.VSIX_PROFILE === 'fast' && results.packaging.result === 'skipped') &&
              (process.env.ADT_LIFECYCLE === 'run' ? results['adt-lifecycle'].result === 'success' :
                process.env.ADT_LIFECYCLE === 'skip' && results['adt-lifecycle'].result === 'skipped');
            const marker = '<!-- osd-pr-test-report -->';
            const icon = (v) => v === 'success' ? '🟢 pass' : v === 'failure' ? '🔴 fail' : v === 'cancelled' ? '⚫ cancelled' : v === 'skipped' ? '⚪ skipped' : '⚪ ' + (v || 'not run');
            const attempts = new Map([[attempt, jobs]]);
            let historyUnreadable = false;
            for (let n = 1; n < attempt; n++) {
              try {
                // GET repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{n}/jobs
                attempts.set(n, await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
                  { owner, repo, run_id: context.runId, attempt_number: n }));
              } catch (error) {
                historyUnreadable = true;
                console.error(error);
              }
            }
            for (let n = 1; n < attempt; n++) {
              for (const job of attempts.get(n) || []) {
                if (job.conclusion !== 'failure') continue;
                for (let m = n + 1; m <= attempt; m++) {
                  if (attempts.get(m)?.some((later) => later.name === job.name && later.conclusion === 'success')) {
                    reports.push(`flaky: rerun ${job.name} failed in attempt ${n}, passed in attempt ${m}`);
                    break;
                  }
                }
              }
            }
            if (historyUnreadable) reports.push('flaky: rerun: earlier attempts unreadable');
            for (const report of reports) console.log(report);
            if (process.env.CAN_COMMENT === 'false') {
              if (historyUnreadable) throw new Error('rerun: earlier attempts unreadable');
              return;
            }
            const took = (j) => (j.started_at && j.completed_at)
              ? `${Math.round((new Date(j.completed_at) - new Date(j.started_at)) / 1000)} s` : '';
            const rows = jobs.filter((j) => j.name !== 'pr-report')
              .map((j) => `| ${j.name} | ${icon(j.conclusion)} | ${took(j)} |`);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### PR tests: ${icon(gatePassed && !historyUnreadable ? 'success' : 'failure')}`,
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 8)}\` · [Full test log](${runUrl})`,
              '',
              '| Job | Result | Time |',
              '| --- | --- | --- |',
              ...rows,
              '',
              ...reports,
              '',
              lifecycle,
              '',
              'Required merge checks: test + scan. ADT lifecycle timing, Docker, gogen, preview, size and queue are advisory on PRs; lifecycle functional checks remain required (Alice, 2026-10-07).',
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            if (historyUnreadable) throw new Error('rerun: earlier attempts unreadable');
