name: VS Code release

on:
  push:
    tags: ['vscode-v*', 'vscode-stable-v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: false
        default: prerelease
        type: choice
        options: [prerelease, stable]
      tag:
        description: Leave blank to use the selected channel and stamped version from the selected ref
        required: false
        default: ''
        type: string
      draft:
        description: Keep the release as a draft (false publishes an existing draft)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: vscode-release-${{ inputs.channel || (startsWith(github.ref_name, 'vscode-stable-v') && 'stable' || 'prerelease') }}-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.sha) || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      scan_status: ${{ steps.leak.outputs.status }}
      full_scan: ${{ steps.leak.outputs.full_scan }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select and validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          channel=prerelease
          prefix=vscode-v
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            channel="${INPUT_CHANNEL:-prerelease}"
            if [[ "$channel" == stable ]]; then prefix=vscode-stable-v; fi
            if [[ "$channel" == stable && "${INPUT_DRAFT:-true}" == false ]]; then
              echo '::error::A stable dispatch is a draft for review only; publish stable with a vscode-stable-v<version> tag'
              exit 1
            fi
            tag="${INPUT_TAG:-$(node scripts/release-version.mjs --suggest | sed "s/^vscode-v/$prefix/")}"
            if [[ "$tag" != "$prefix"* ]]; then
              echo '::error::Release tag must match the selected channel'
              exit 1
            fi
            version=$(node scripts/release-version.mjs "$tag" --allow-untagged)
          else
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" == vscode-stable-v* ]]; then channel=stable; fi
            version=$(node scripts/release-version.mjs "$tag")
          fi
          printf 'tag=%s\nchannel=%s\nversion=%s\n' "$tag" "$channel" "$version" >> "$GITHUB_OUTPUT"
      - name: Require a new Marketplace version
        # Only stable needs it: a prerelease rerun must still be able to repair
        # its GitHub release before the Marketplace job reports the duplicate.
        if: steps.release.outputs.channel == 'stable'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          npm exec --yes --package=@vscode/vsce@4.0.0 -- \
            vsce show oisee.open-steamgate --json > "$RUNNER_TEMP/marketplace.json"
          jq -e '.versions | type == "array"' "$RUNNER_TEMP/marketplace.json" >/dev/null
          if jq -e --arg version "$RELEASE_VERSION" 'any(.versions[]; .version == $version)' "$RUNNER_TEMP/marketplace.json" >/dev/null; then
            echo "::error::Marketplace version $RELEASE_VERSION already exists. A prerelease cannot be republished as stable; release a new commit with a new stamped version."
            exit 1
          fi
      - run: npm ci
      - name: Build and link the pinned transpiler and runtime
        run: |
          node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
          echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
      - run: bash tools/osd-ci-transpiler-build.sh build
      - run: |
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
      - run: npm run bootstrap
      - run: npm run vsix
      - name: Check the bundled transpiler and runtime
        run: node scripts/verify-vsix-transpiler.mjs build/vsix/*.vsix
      - name: Check package version and checksum
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG##*v}"
          vsix="build/vsix/open-steamgate-$version.vsix"
          test -f "$vsix"
          node scripts/release-version.mjs "$RELEASE_TAG" "$vsix" --allow-untagged
          (cd build/vsix && sha256sum "open-steamgate-$version.vsix" > "open-steamgate-$version.vsix.sha256")
      - name: Generate and scan CHANGELOG, README and FILE_ID.DIZ
        id: leak
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LEAK_IDENTIFIERS_JSON: ${{ secrets.OSD_LEAK_IDENTIFIERS }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG##*v}"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            node scripts/release-notes.mjs "$RELEASE_TAG" > build/vsix/CHANGELOG.md
          else
            node scripts/release-notes.mjs "$RELEASE_TAG" --to HEAD > build/vsix/CHANGELOG.md
          fi
          node scripts/release-readme.mjs \
            "open-steamgate-$version.vsix" \
            osd-linux-x64 osd-linux-arm64 osd-darwin-arm64 osd-darwin-x64 osd-windows-x64.exe osd-windows-arm64.exe \
            osgo-linux-x64 osgo-linux-arm64 osgo-darwin-arm64 osgo-darwin-x64 osgo-windows-x64.exe osgo-windows-arm64.exe \
            sqlite.yml duckdb.yml postgres.yml hana.yml > build/vsix/README.md
          node scripts/release-readme.mjs --diz "$version" > build/vsix/FILE_ID.DIZ
          { cat build/vsix/README.md; printf '\nChanges: see CHANGELOG.md\n'; } > build/vsix/release-body.md
          test -s build/vsix/CHANGELOG.md
          test -s build/vsix/README.md
          test -s build/vsix/FILE_ID.DIZ
          if [[ -n "$LEAK_IDENTIFIERS_JSON" ]]; then
            umask 077
            mkdir -p .local
            printf '%s' "$LEAK_IDENTIFIERS_JSON" > .local/leak-identifiers.json
            # the log is public: mask every name and category before any scan
            # output, and let the scan print hashes instead of values
            node tools/osd-leak-scan.mjs --print-masks
          fi
          status=0
          node tools/osd-leak-scan.mjs --redact --paths build/vsix/CHANGELOG.md build/vsix/README.md build/vsix/FILE_ID.DIZ || status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          full_scan=false
          if [[ "$status" -eq 0 && -n "$LEAK_IDENTIFIERS_JSON" ]]; then
            full_scan=true
          fi
          printf 'full_scan=%s\n' "$full_scan" >> "$GITHUB_OUTPUT"
          if [[ "$full_scan" != true ]]; then
            if release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null) && [[ "$release_is_draft" != true ]]; then
              echo '::error::An existing published release requires OSD_LEAK_IDENTIFIERS and scanner exit 0 before editing or uploading'
              exit 1
            fi
          fi
          if [[ "$status" -eq 2 && -z "$LEAK_IDENTIFIERS_JSON" && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DRAFT" == true ]]; then
            echo '::warning::OSD_LEAK_IDENTIFIERS is absent; the private name check did not run'
          elif [[ "$status" -ne 0 ]]; then
            if [[ "$status" -eq 2 && -z "$LEAK_IDENTIFIERS_JSON" ]]; then
              echo '::error::Add the OSD_LEAK_IDENTIFIERS secret or publish by hand after a local npm run leak'
            else
              echo "::error::Release leak scan must pass with the configured identifier list (exit $status)"
            fi
            exit "$status"
          fi
      - name: Create or update release and upload VSIX
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          FULL_SCAN: ${{ steps.leak.outputs.full_scan }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          release_flags=(--prerelease)
          if [[ "$RELEASE_CHANNEL" == stable ]]; then release_flags=(--prerelease=false --latest); fi
          version="${RELEASE_TAG##*v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --tags --force
            node scripts/release-version.mjs --check-target "$RELEASE_TAG"
            release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [[ "$release_is_draft" != true && "$FULL_SCAN" != true ]]; then
              echo '::error::An existing published release requires OSD_LEAK_IDENTIFIERS and scanner exit 0 before editing or uploading'
              exit 1
            fi
            if [[ "$release_is_draft" != true ]]; then
              # A rerun may edit a public release only after this tag's tests pass.
              tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
              node tools/osd-ci-wait-tests.mjs "$RELEASE_TAG" "$tag_sha"
            fi
            gh release edit "$RELEASE_TAG" "${release_flags[@]}" --title "$RELEASE_TAG" --notes-file build/vsix/release-body.md
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$DRAFT" == false ]]; then
              echo 'Run once with draft=true before publishing an untagged dispatch release' >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --draft "${release_flags[@]}" --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_TAG" --notes-file build/vsix/release-body.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$(git rev-parse HEAD)" \
              --draft "${release_flags[@]}" --title "$RELEASE_TAG" --notes-file build/vsix/release-body.md
          fi
          release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [[ "$release_is_draft" != true && "$FULL_SCAN" != true ]]; then
            echo '::error::An existing published release requires OSD_LEAK_IDENTIFIERS and scanner exit 0 before editing or uploading'
            exit 1
          fi
          if [[ "$release_is_draft" != true ]]; then
            tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            node tools/osd-ci-wait-tests.mjs "$RELEASE_TAG" "$tag_sha"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "build/vsix/open-steamgate-$version.vsix" \
            "build/vsix/open-steamgate-$version.vsix.sha256" \
            build/vsix/README.md \
            build/vsix/CHANGELOG.md \
            build/vsix/FILE_ID.DIZ

  binary:
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            asset: osd-linux-x64
          - target: bun-linux-arm64
            asset: osd-linux-arm64
          - target: bun-darwin-arm64
            asset: osd-darwin-arm64
          # baseline like the other x64 targets: no AVX2, so pre-Haswell
          # Intel Macs and Rosetta 2 before macOS 15 can run it
          - target: bun-darwin-x64-baseline
            asset: osd-darwin-x64
          - target: bun-windows-x64-baseline
            asset: osd-windows-x64.exe
          - target: bun-windows-arm64
            asset: osd-windows-arm64.exe
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      FULL_SCAN: ${{ needs.vsix.outputs.full_scan }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - name: Build and link the pinned transpiler and runtime
        run: |
          node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
          echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
      - run: bash tools/osd-ci-transpiler-build.sh build
      - run: |
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
      - run: npm run bootstrap
      - name: Build and checksum the target binary
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs "$RELEASE_TAG" --allow-untagged
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          mkdir -p build/release
          npm run binary -- --seed "build/release/$ASSET" "$TARGET"
          (cd build/release && sha256sum "$ASSET" > "$ASSET.sha256")
          # by content, before anything is uploaded: the header names this
          # target, and the one binary this runner can execute boots from its
          # seed, answers the demo service and serves this commit's source
          node scripts/release-verify.mjs binary "build/release/$ASSET" "$TARGET"
          if [[ "$TARGET" == bun-linux-x64-baseline ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
            # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor;
            # bubblewrap needs them to hide the checkout from the binary under test.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            node scripts/smoke-binary.mjs "build/release/$ASSET"
            node scripts/release-verify.mjs serve "build/release/$ASSET" --timeout 300
          fi
          release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [[ "$release_is_draft" != true && "$FULL_SCAN" != true ]]; then
            echo '::error::An existing published release requires OSD_LEAK_IDENTIFIERS and scanner exit 0 before uploading'
            exit 1
          fi
          if [[ "$release_is_draft" != true ]]; then
            tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            node tools/osd-ci-wait-tests.mjs "$RELEASE_TAG" "$tag_sha"
          fi
          gh release upload "$RELEASE_TAG" --clobber "build/release/$ASSET" "build/release/$ASSET.sha256"

  compose:
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      FULL_SCAN: ${{ needs.vsix.outputs.full_scan }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and attach Compose variants
        run: |
          set -euo pipefail
          node scripts/release-version.mjs "$RELEASE_TAG" --allow-untagged
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          export POSTGRES_PASSWORD=compose-validation-only
          export HANA_HOST=hana-validation-only
          export HANA_USER=hana-validation-only
          export HANA_PASSWORD=compose-validation-only
          for db in sqlite duckdb postgres hana; do
            docker compose -f "docker/compose/$db.yml" config --quiet
            release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [[ "$release_is_draft" != true && "$FULL_SCAN" != true ]]; then
              echo '::error::An existing published release requires OSD_LEAK_IDENTIFIERS and scanner exit 0 before uploading'
              exit 1
            fi
            if [[ "$release_is_draft" != true ]]; then
              tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
              node tools/osd-ci-wait-tests.mjs "$RELEASE_TAG" "$tag_sha"
            fi
            gh release upload "$RELEASE_TAG" --clobber "docker/compose/$db.yml"
          done

  osgo:
    needs: [vsix, tagged_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, asset: osgo-linux-x64}
          - {goos: linux, goarch: arm64, asset: osgo-linux-arm64}
          - {goos: darwin, goarch: arm64, asset: osgo-darwin-arm64}
          - {goos: darwin, goarch: amd64, asset: osgo-darwin-x64}
          - {goos: windows, goarch: amd64, asset: osgo-windows-x64.exe}
          - {goos: windows, goarch: arm64, asset: osgo-windows-arm64.exe}
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      FULL_SCAN: ${{ needs.vsix.outputs.full_scan }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gogen/go/go.sum
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - name: Build and link the pinned transpiler
        run: |
          export TRANSPILER="$RUNNER_TEMP/transpiler"
          echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
          bash tools/osd-ci-transpiler-build.sh build
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-transpiler.mjs
      - name: Fetch libraries and generate OSGo
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          node tools/osd-libs.mjs
          node tools/osd-libs.mjs --check
          node tools/osd-fetch.mjs
          npm run transpile
          (cd tools/gogen/go && go mod download)
          node tools/gogen/osgo.mjs
      - name: Cross-build, verify and attach OSGo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET: ${{ matrix.asset }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          node scripts/release-version.mjs "$RELEASE_TAG" --allow-untagged
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          mkdir -p build/release
          commit="$(git rev-parse HEAD)"
          (cd tools/gogen/go && go build -trimpath -ldflags="-s -w -X main.releaseTag=$RELEASE_TAG -X main.releaseCommit=$commit" -o "../../../build/release/$ASSET" ./cmd/osgo)
          for private_path in "$GITHUB_WORKSPACE" "$HOME"; do
            if [[ -n "$private_path" ]] && LC_ALL=C grep -aFq "$private_path" "build/release/$ASSET"; then
              echo "::error::OSGo binary contains a runner path"
              exit 1
            fi
          done
          (cd build/release && sha256sum "$ASSET" > "$ASSET.sha256")
          file "build/release/$ASSET"
          node scripts/release-verify.mjs binary "build/release/$ASSET" "go-$GOOS-$GOARCH"
          if [[ "$GOOS" == linux ]]; then
            if readelf -l "build/release/$ASSET" | grep -q INTERP; then
              echo '::error::OSGo has an ELF dynamic interpreter'
              exit 1
            fi
          fi
          if [[ "$ASSET" == osgo-linux-x64 ]]; then
            if ldd "build/release/$ASSET" > "$RUNNER_TEMP/osgo-ldd.txt" 2>&1; then
              echo '::error::OSGo is dynamically linked'
              exit 1
            fi
            grep -Eq 'not a dynamic executable|statically linked' "$RUNNER_TEMP/osgo-ldd.txt"
            node scripts/release-verify-osgo.mjs "build/release/$ASSET" "$RELEASE_TAG" "$commit"
          fi
          release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [[ "$release_is_draft" != true && "$FULL_SCAN" != true ]]; then
            echo '::error::An existing published release requires OSD_LEAK_IDENTIFIERS and scanner exit 0 before uploading'
            exit 1
          fi
          if [[ "$release_is_draft" != true ]]; then
            tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            node tools/osd-ci-wait-tests.mjs "$RELEASE_TAG" "$tag_sha"
          fi
          gh release upload "$RELEASE_TAG" --clobber "build/release/$ASSET" "build/release/$ASSET.sha256"

  tagged_tests:
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      # write, not read: `--check-target` reads the release the vsix job just
      # created, and a draft release is invisible to a read-only token
      # (vscode-v0.2.1282 stopped here with `gh release view` failing).
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged tests run before publication
        if: github.event_name == 'push' || !inputs.draft
        env:
          RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          node tools/osd-ci-wait-tests.mjs "$RELEASE_TAG" "$tag_sha"

  publish:
    needs: [vsix, binary, osgo, compose, tagged_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.vsix.outputs.channel }}
      DRAFT: ${{ inputs.draft }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LEAK_IDENTIFIERS_JSON: ${{ secrets.OSD_LEAK_IDENTIFIERS }}
      SCAN_STATUS: ${{ needs.vsix.outputs.scan_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish completed release
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push || "$DRAFT" == false ]]; then
            if [[ -z "$LEAK_IDENTIFIERS_JSON" ]]; then
              echo '::error::Add the OSD_LEAK_IDENTIFIERS secret or publish by hand after a local npm run leak'
              exit 1
            fi
            if [[ "$SCAN_STATUS" != 0 ]]; then
              echo "::error::Publication requires a passing release leak scan (exit $SCAN_STATUS)"
              exit 1
            fi
          fi
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          for asset in \
            osd-linux-x64 osd-linux-arm64 osd-darwin-arm64 osd-darwin-x64 osd-windows-x64.exe osd-windows-arm64.exe \
            osgo-linux-x64 osgo-linux-arm64 osgo-darwin-arm64 osgo-darwin-x64 osgo-windows-x64.exe osgo-windows-arm64.exe; do
            grep -Fxq "$asset" "$RUNNER_TEMP/release-assets.txt"
            grep -Fxq "$asset.sha256" "$RUNNER_TEMP/release-assets.txt"
          done
          if [[ "$GITHUB_EVENT_NAME" == push || "$DRAFT" == false ]]; then
            release_flags=(--prerelease)
            if [[ "$RELEASE_CHANNEL" == stable ]]; then release_flags=(--prerelease=false --latest); fi
            gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
          fi

  marketplace:
    # A draft dispatch is useful for review, but must never publish to the
    # Marketplace. Only the immutable tag-push path is a deployment trigger.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/vscode-v') || startsWith(github.ref, 'refs/tags/vscode-stable-v'))
    needs: [vsix, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.vsix.outputs.channel }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and link the pinned transpiler and runtime
        run: |
          node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
          echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
      - run: bash tools/osd-ci-transpiler-build.sh build
      - run: |
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
      - run: npm run bootstrap
      # The browser entry (vscode.dev): built fresh here, so the Marketplace
      # archive carries a bundle of this commit (docs/vscode-web.md).
      - name: Build the VS Code web extension
        run: npm run web:vscode
      - name: Build the Marketplace VSIX
        run: |
          set -euo pipefail
          export OSD_VSIX_PROFILE=marketplace
          export OSD_VSIX_WEB=1
          export OSD_VSIX_PRERELEASE=0
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then export OSD_VSIX_PRERELEASE=1; fi
          npm run vsix 2>&1 | tee "$RUNNER_TEMP/marketplace-build.log"
          node scripts/verify-vsix-transpiler.mjs build/vsix/*.vsix
          # These two placeholder licences have explicit maintainer overrides
          # in third-party-notices.mjs. Any new issue needs a fresh review.
          grep 'LICENSE REVIEW:' "$RUNNER_TEMP/marketplace-build.log" \
            | sed 's/^.*LICENSE REVIEW: //' > "$RUNNER_TEMP/licence-review-actual.txt" || true
          cat > "$RUNNER_TEMP/licence-review-accepted.txt" <<'EOF'
          .local/lars/open-abap-gui: LICENSE file is a placeholder
          .local/lars/open-abap-odata: LICENSE file is a placeholder
          EOF
          if ! diff -u "$RUNNER_TEMP/licence-review-accepted.txt" "$RUNNER_TEMP/licence-review-actual.txt"; then
            echo '::error::Review new third-party licence issues before Marketplace publication'
            exit 1
          fi
          vsix="build/vsix/open-steamgate-${RELEASE_TAG##*v}.vsix"
          node scripts/release-version.mjs "$RELEASE_TAG" "$vsix"
          unzip -tq "$vsix"
          unzip -p "$vsix" extension.vsixmanifest > "$RUNNER_TEMP/marketplace-manifest.xml"
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
            grep -q 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"' "$RUNNER_TEMP/marketplace-manifest.xml"
          elif grep -q 'Id="Microsoft.VisualStudio.Code.PreRelease"' "$RUNNER_TEMP/marketplace-manifest.xml"; then
            echo '::error::Stable Marketplace VSIX contains the prerelease property'
            exit 1
          fi
          if unzip -p "$vsix" extension/package.json | jq -e 'has("browser")' >/dev/null; then
            echo '::error::Marketplace profile unexpectedly contains a browser entry'
            exit 1
          fi
      - name: Publish the built VSIX to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$VSCE_PAT" ]]; then
            echo '::error::Configure the VSCE_PAT Actions secret before publishing'
            exit 1
          fi
          vsix="build/vsix/open-steamgate-${RELEASE_TAG##*v}.vsix"
          publish_flags=()
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then publish_flags=(--pre-release); fi
          npm exec --yes --package=@vscode/vsce@4.0.0 -- \
            vsce publish "${publish_flags[@]}" --packagePath "$vsix"
