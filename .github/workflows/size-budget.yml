name: size budget

# Monoliths may shrink, never grow: tools/osd-size-budget.mjs against
# tools/osd-size-budget.json. A file or package over its budget, a new file
# in go/abap, a package without a README or importing go/abap, or a budget
# raised against the base branch without a reason is reported. Here it is
# advisory (--warn: annotations, never red; Alice 2026-10-02); the same check
# warns in yellow at pre-commit and blocks at pre-push (.githooks/), where it belongs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its run; pushes elsewhere are
# never cancelled (the same rule as tests.yml, #602).
concurrency:
  group: size-budget-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gogen/go/go.sum
      # the base: the target branch of a pull request, the commit before a
      # push to main (a push compared with main itself would check nothing)
      - name: The base's budget
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          else git fetch --no-tags --depth=1 origin "$BEFORE"; fi
      - name: Size budget
        run: node tools/osd-size-budget.mjs --base FETCH_HEAD --warn
      - name: abapiti type forms (advisory)
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          node tools/gogen/abapiti-lint.mjs --check --warn
