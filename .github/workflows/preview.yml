name: preview deployment

# Every pull request and every push to main gets a copy of open-steamgate that
# runs entirely in the browser (build/preview/: the gateway in a service worker, the
# Fiori demo app), written to the gh-pages branch and deployed from there by
# pages.yml (main and the open pull requests only, checked by content):
#   main         -> https://oisee.github.io/open-steamgate/main/
#   PR <n>       -> https://oisee.github.io/open-steamgate/pr-<n>/
# The pattern is larshp/hithub's preview-deploy workflow (MIT).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.action != 'closed'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_DIRECTORY: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      # The integration build is based on upstream 2.14.3 and keeps the
      # fork's builtin, incremental-build, packed and overflow fixes.
      # Parser 2.120.73 is shared with OSG and checked by the build gate.
      # The W3MI, binary output and float fixes are now upstream.
      # See docs/transpiler-pin-2.md for the reviewed pin set.
      #
      # So the deployment is pinned to a commit of an integration branch,
      # built here and linked the same way a developer links it. Pinned to a
      # SHA rather than a branch on purpose: a moving branch would make the
      # public site depend on what somebody pushed this morning. The SHA and
      # repo are loaded from libs.lock.json at the start of the job.
      # Outside the checkout, and absolute: actions/cache silently refuses to
      # save a path with ".." in it ("Relative pathing '.' and '..' is not
      # allowed"), which is how the first version of this cache never hit.
      - name: Where the pinned transpiler lives
        run: echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
      - name: Restore the pinned transpiler build
        id: transpiler_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/transpiler
          key: transpiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('libs.lock.json') }}-${{ hashFiles('tools/osd-ci-transpiler-build.sh') }}
      - name: Build the transpiler this deployment is pinned to
        if: steps.transpiler_cache.outputs.cache-hit != 'true'
        run: bash tools/osd-ci-transpiler-build.sh build
      - name: Verify and link the pinned transpiler
        run: |
          bash tools/osd-ci-transpiler-build.sh verify
          # three packages, not two: the transpile is a library call into
          # @abaplint/transpiler (tools/osd-transpile.mjs), and with only the
          # CLI linked the published transpiler did the work - every W3MI
          # object was then keyed on its escaped file name and every picture
          # and the Zork story were 404 in the browser check
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-transpiler.mjs
      # The library patches this tree holds until they land upstream. The
      # media path runs on SCMS_BINARY_TO_XSTRING, which open-abap-core does
      # not have, and on a WWWDATA_IMPORT that consumes its remainder; a
      # runner that clones upstream gets a handler that raises on every
      # picture and on the Zork story (500 in the browser check, measured
      # 2026-09-17 after the objid fix turned the 404 into a 500). So the
      # library is taken from the same integration branch the workstation
      # runs, at a commit, into the folder abap_transpile.json names first.
      # DEBT-2026-09-14-ci-pinned-transpiler covers this pin as well: it
      # goes when the pull requests to open-abap-core are released.
      # Verify that every library folder named by the transpile config is at
      # the ref in libs.lock.json before the fail-fast build validates inputs.
      - name: The library folders the preview reads
        run: |
          node tools/osd-libs.mjs
          node tools/osd-libs.mjs --check
      # Review the three source pin sets together: transpiler, core library,
      # and pack manifests. This move keeps the already-pinned pack refs;
      # osd-fetch verifies them alongside the new library and compiler refs.
      # The packs: the demo and Zork are not in this repository, they are
      # fetched from theirs at the commit each pack's manifest pins
      # (tools/osd-fetch.mjs), and the pack's own folder layers over that.
      # The build refuses a pack that was not fetched, so this step is not
      # optional: without it the preview would be published smaller than
      # the manifests say and look complete.
      - name: Fetch the pack sources
        run: node tools/osd-fetch.mjs
      # Keep the existing sql.js regression suite: the public Pages build
      # changes database, but it must not silently lose coverage of the
      # original browser runtime.
      - run: npm run web:preview
      - name: Read the installed Playwright version
        id: playwright_version
        run: node -e 'console.log("version=" + require("./package-lock.json").packages["node_modules/@playwright/test"].version)' >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: chromium_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium and system dependencies
        run: |
          if [[ "${{ steps.chromium_cache.outputs.cache-hit }}" == true ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check the sql.js build in a browser
        run: npx playwright test --config playwright.preview.config.mjs
      # On main the build directory is replaced here: only the DuckDB-Wasm
      # build below is published, and only if its own browser check passes.
      # The previous gh-pages/main stays active if either build or check
      # fails. A pull request publishes the sql.js build it has just checked
      # and skips the second build (Alice, 2026-09-29): it was about 4.5 of
      # the job's 10 minutes, and Portable AMDP is still checked on every
      # push to main.
      - name: Build Pages with DuckDB-Wasm and Portable AMDP
        if: github.event_name != 'pull_request'
        run: OSD_PREVIEW_DB=duckdb node scripts/build-preview.mjs
      - name: Check Portable AMDP in the Pages build
        if: github.event_name != 'pull_request'
        run: OSD_PREVIEW_DB=duckdb npx playwright test --config playwright.preview.config.mjs
      - name: Screenshots
        run: node scripts/capture-screenshots.mjs
      # The VS Code web extension rides along as a plain directory, so
      # vscode.dev installs it from <preview>/vscode-web/ ("Install Extension
      # From Location"; docs/vscode-web.md). It is built after every check and
      # screenshot of the preview above: web:vscode transpiles its own pack
      # selection and rewrites web/generated/, never build/preview itself.
      - name: VS Code web extension
        run: |
          npm run web:vscode
          npm run web:vscode:stage
      - name: Publish to gh-pages
        # This is deliberately after the browser check and screenshots.  The
        # explicit success guard documents the safety property: a failed
        # build, test, or screenshot step never replaces the last published
        # preview.
        if: ${{ success() }}
        run: node scripts/pages-push.mjs publish "$PREVIEW_DIRECTORY" build/preview
      - name: Refresh the index of all published previews
        if: ${{ success() }}
        run: node scripts/pages-push.mjs index
      - name: Preview comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- open-steamgate-preview -->'
          base="https://oisee.github.io/open-steamgate/pr-$PR_NUMBER"
          body=$(printf '%s\n\nPreview: [open the launchpad](%s/app/flp.html) - the OData gateway, the demo and Zork run in your browser, no server.\n\n[Screenshots](%s/screenshots/) - built from `%s`' \
            "$marker" "$base" "$base" "${GITHUB_SHA:0:7}")
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty")
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  remove:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove the preview directory
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pages-push.mjs remove "pr-$PR_NUMBER"
