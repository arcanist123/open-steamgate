# The system OSD is, as a service it serves itself.
#
# Seven DDIC tables are the storage (src/status/*.tabl.xml); the data model
# is CDS over them (src/cds/zc_osd_*.ddls.asddls), and this file is the
# service shell: seven entity sets, all read-only, each `cds:`-sourced, so
# the generic SADL delegation reads them and no hand-written DPC exists.
# What fills the tables is the facade: it knows the live facts (ports, pool
# children, generation, ICF services, packs), computes a snapshot
# (tools/osd-status.mjs) and posts it to ZCL_OSD_STATUS=>REFRESH before a
# read of this service is proxied.
#
# Six unconditional navigations: five mirror the five associations
# ZC_OSD_SYSTEM exposes (_Processes, _Ports, _Services, _Packs, _Database),
# and to_Amdp has no CDS association at all. None carries a referential
# constraint, on purpose: there is one system row, and every process, port,
# service, pack and AMDP method of this instance belongs to it, so the association is
# unconditional and the SADL runtime reads the whole target set for the
# expand (zcl_stg_sadl_dpc~navigation_where finds no constraint pair and
# adds no WHERE).
#
# Compiled by `stg-compile --all` during `npm run transpile` into
# gen/stg/zosd_status/.
project: ZOSD_STATUS
service: ZOSD_STATUS_SRV
model: ZOSD_STATUS_MDL
description: "OSD system status: processes, ports, services, packs"

entities:
  System:
    set: SystemSet
    description: "the system this runtime is"
    source: {cds: ZC_OSD_SYSTEM, struct: "ZCL_STG_CDS_ZVOSDSYS=>TY_ROW"}
    keys: [Sid]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      Sid: {type: String(8), field: SID, readonly: true, label: System}
      HostKind: {type: String(8), field: HOSTKIND, readonly: true, label: Host}
      GenLive: {type: String(40), field: GENLIVE, readonly: true, label: Generation built}
      GenServing: {type: String(40), field: GENSERVING, readonly: true, label: Generation serving}
      Synced: {type: String(1), field: SYNCED, readonly: true, label: In step}
      Workers: {type: Int32, field: WORKERS, readonly: true, label: Work processes}
      StartedAt: {type: String(30), field: STARTEDAT, readonly: true, label: Started}
      SnapAt: {type: String(30), field: SNAPAT, readonly: true, label: Snapshot taken}
      RootHint: {type: String(60), field: ROOTHINT, readonly: true, label: Tree}
      # the process the tables were written in, and the number SAP Easy
      # Access prints where SAP GUI prints the session (src/webgui/)
      Pid: {type: String(10), field: PID, readonly: true, label: Work process}

  Process:
    set: ProcessSet
    description: "the work processes of the pool"
    source: {cds: ZC_OSD_PROCESS, struct: "ZCL_STG_CDS_ZVOSDPROC=>TY_ROW"}
    keys: [Pid]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      Pid: {type: String(10), field: PID, readonly: true, label: Process}
      Role: {type: String(10), field: ROLE, readonly: true, label: Role}
      Port: {type: String(6), field: PORT, readonly: true, label: Port}
      Generation: {type: String(40), field: GENERATION, readonly: true, label: Generation}
      Epoch: {type: String(6), field: EPOCH, readonly: true, label: Epoch}
      Since: {type: String(30), field: SINCE, readonly: true, label: Since}
      Sockets: {type: Int32, field: SOCKETS, readonly: true, label: Sockets}
      RssMb: {type: Int32, field: RSSMB, readonly: true, label: RSS (MB)}
      Alive: {type: String(1), field: ALIVE, readonly: true, label: Alive}

  WorkProcess:
    set: WorkProcessSet
    description: "the work processes of this sidecar (ZOSD_WP, the SM50 shape)"
    source: {cds: ZC_OSD_WP, struct: "ZCL_STG_CDS_ZVOSDWP=>TY_ROW"}
    keys: [Wpno]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      Wpno: {type: Int32, field: WPNO, readonly: true, label: Work process}
      Kind: {type: String(4), field: KIND, readonly: true, label: Kind}
      State: {type: String(10), field: STATE, readonly: true, label: State}
      Generation: {type: String(40), field: GENERATION, readonly: true, label: Generation}
      Started: {type: String(30), field: STARTED, readonly: true, label: Step started}
      Username: {type: String(12), field: USERNAME, readonly: true, label: User}
      Report: {type: String(60), field: REPORT, readonly: true, label: Report}

  Port:
    set: PortSet
    description: "the ports of this instance"
    source: {cds: ZC_OSD_PORT, struct: "ZCL_STG_CDS_ZVOSDPORT=>TY_ROW"}
    keys: [Port]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      Port: {type: String(6), field: PORT, readonly: true, label: Port}
      Protocol: {type: String(8), field: PROTOCOL, readonly: true, label: Protocol}
      Purpose: {type: String(60), field: PURPOSE, readonly: true, label: Purpose}
      State: {type: String(12), field: STATE, readonly: true, label: State}
      Note: {type: String(120), field: NOTE, readonly: true, label: Note}

  Service:
    set: ServiceSet
    description: "the OData, ICF, push and UI5 services this system serves"
    source: {cds: ZC_OSD_SERVICE, struct: "ZCL_STG_CDS_ZVOSDSVC=>TY_ROW"}
    keys: [Path]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      Path: {type: String(120), field: PATH, readonly: true, label: Path}
      Kind: {type: String(8), field: KIND, readonly: true, label: Kind}
      HandlerName: {type: String(60), field: HANDLERNAME, readonly: true, label: Handler}
      Text: {type: String(120), field: TEXT, readonly: true, label: Name}
      Pack: {type: String(30), field: PACK, readonly: true, label: Pack}

  Pack:
    set: PackSet
    description: "the content packs layered into this system"
    source: {cds: ZC_OSD_PACK, struct: "ZCL_STG_CDS_ZVOSDPACK=>TY_ROW"}
    keys: [Name]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      Name: {type: String(30), field: NAME, readonly: true, label: Pack}
      PackOrder: {type: Int32, field: PACKORDER, readonly: true, label: Order}
      Objects: {type: Int32, field: OBJECTS, readonly: true, label: Objects}
      Folders: {type: String(120), field: FOLDERS, readonly: true, label: Folders}
      Description: {type: String(120), field: DESCRIPTION, readonly: true, label: Description}

  Database:
    set: DatabaseSet
    description: "safe facts about the database and runtime platform"
    source: {cds: ZC_OSD_DATABASE, struct: "ZCL_STG_CDS_ZVOSDDB=>TY_ROW"}
    keys: [Category, Name]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      Category: {type: String(20), field: CATEGORY, readonly: true, label: Category}
      Name: {type: String(60), field: NAME, readonly: true, label: Fact}
      Value: {type: String(240), field: VALUE, readonly: true, label: Value}
      Note: {type: String(240), field: NOTE, readonly: true, label: Note}

  # Every AMDP method of the tree (BY DATABASE PROCEDURE / FUNCTION FOR HDB)
  # with the engine its body runs on at the moment of the snapshot: read off
  # the AMDP destination's real session and the system connection
  # (tools/amdp-status.mjs), classified in ZCL_OSD_STATUS=>ENGINE. The page
  # used to say "HDB" off the system connection while the eAMDP session was
  # dead (docs/backlog/data-analytics.md); this row says what a call would do.
  AmdpMethod:
    set: AmdpMethodSet
    description: "the AMDP methods of the tree and where each body runs now"
    source: {cds: ZC_OSD_AMDP, struct: "ZCL_STG_CDS_ZVOSDAMDP=>TY_ROW"}
    keys: [ClassName, MethodName]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      ClassName: {type: String(30), field: CLASSNAME, readonly: true, label: Class}
      MethodName: {type: String(30), field: METHODNAME, readonly: true, label: Method}
      Kind: {type: String(10), field: KIND, readonly: true, label: Kind}
      Portable: {type: String(1), field: PORTABLE, readonly: true, label: Portable subset}
      Engine: {type: String(20), field: ENGINE, readonly: true, label: Engine}
      Reason: {type: String(240), field: REASON, readonly: true, label: Reason}
      Refusal: {type: String(240), field: REFUSAL, readonly: true, label: Portable refusal}

associations:
  SystemToProcesses:
    from: System
    to: Process
    cardinality: 1:N
    navigation: {System: to_Processes}
  SystemToPorts:
    from: System
    to: Port
    cardinality: 1:N
    navigation: {System: to_Ports}
  SystemToServices:
    from: System
    to: Service
    cardinality: 1:N
    navigation: {System: to_Services}
  SystemToPacks:
    from: System
    to: Pack
    cardinality: 1:N
    navigation: {System: to_Packs}
  SystemToDatabase:
    from: System
    to: Database
    cardinality: 1:N
    navigation: {System: to_Database}
  SystemToAmdp:
    from: System
    to: AmdpMethod
    cardinality: 1:N
    navigation: {System: to_Amdp}

annotations:
  System:
    header: {typeName: System, typeNamePlural: Systems, title: Sid, description: GenLive}
    selectionFields: [Sid, HostKind]
    lineItem:
      - {value: Sid, label: System}
      - {value: HostKind, label: Host}
      - {value: GenLive, label: Generation built}
      - {value: GenServing, label: Generation serving}
      - {value: Workers, label: Work processes}
      - {value: SnapAt, label: Snapshot taken}
    # the header of the object page, not its body: without this the header
    # carries only the title and the description of `header:` above
    headerFacets:
      - {id: Runtime, label: Runtime, fieldGroup: Runtime}
      - {id: Build, label: Build, fieldGroup: Build}
    facets:
      - {id: General, label: General, fieldGroup: General}
      - {id: Processes, label: Processes, lineItem: to_Processes}
      - {id: Ports, label: Ports, lineItem: to_Ports}
      - {id: Services, label: Services, lineItem: to_Services}
      - {id: Packs, label: Packs, lineItem: to_Packs}
      - {id: Database, label: Environment, lineItem: to_Database}
      - {id: Amdp, label: AMDP methods, lineItem: to_Amdp}
    fieldGroups:
      General: [Sid, HostKind, GenLive, GenServing, Synced, Workers, StartedAt, SnapAt, RootHint, Pid]
      Runtime: [HostKind, Workers, StartedAt, Pid]
      Build: [GenLive, GenServing, Synced, SnapAt]
  System/Sid: {label: System}
  System/HostKind: {label: Host}
  System/GenLive: {label: Generation built}
  System/GenServing: {label: Generation serving}
  System/Synced: {label: In step}
  System/Workers: {label: Work processes}
  System/StartedAt: {label: Started}
  System/SnapAt: {label: Snapshot taken}
  System/RootHint: {label: Tree}
  System/Pid: {label: Work process}

  Process:
    header: {typeName: Process, typeNamePlural: Processes, title: Pid, description: Role}
    selectionFields: [Role, Generation, Alive]
    lineItem:
      - {value: Pid, label: Process}
      - {value: Role, label: Role}
      - {value: Port, label: Port}
      - {value: Generation, label: Generation}
      - {value: Sockets, label: Sockets}
      - {value: RssMb, label: RSS (MB)}
    facets:
      - {id: ProcessGeneral, label: General, fieldGroup: General}
    fieldGroups:
      General: [Pid, Role, Port, Generation, Epoch, Since, Sockets, RssMb, Alive]
  Process/Pid: {label: Process}
  Process/Role: {label: Role}
  Process/Port: {label: Port}
  Process/Generation: {label: Generation}
  Process/Epoch: {label: Epoch}
  Process/Since: {label: Since}
  Process/Sockets: {label: Sockets}
  Process/RssMb: {label: RSS (MB)}
  Process/Alive: {label: Alive}

  Port:
    header: {typeName: Port, typeNamePlural: Ports, title: Port, description: Purpose}
    selectionFields: [Protocol, State]
    lineItem:
      - {value: Port, label: Port}
      - {value: Protocol, label: Protocol}
      - {value: Purpose, label: Purpose}
      - {value: State, label: State}
    facets:
      - {id: PortGeneral, label: General, fieldGroup: General}
    fieldGroups:
      General: [Port, Protocol, Purpose, State, Note]
  Port/Port: {label: Port}
  Port/Protocol: {label: Protocol}
  Port/Purpose: {label: Purpose}
  Port/State: {label: State}
  Port/Note: {label: Note}

  Service:
    header: {typeName: Service, typeNamePlural: Services, title: Path, description: Kind}
    selectionFields: [Kind, Pack]
    lineItem:
      - {value: Path, label: Path}
      - {value: Kind, label: Kind}
      - {value: Text, label: Name}
      - {value: HandlerName, label: Handler}
      - {value: Pack, label: Pack}
      # **Reached from the status app, not only from the launchpad** (Alice,
      # 2026-09-18, in the G.5 specification). This list is where a person
      # already is when they are wondering what answers a path; the registry
      # is the next question, so it is a button here rather than a tile they
      # have to go back for.
      - {intent: {semanticObject: IcfNode, action: manage, label: ICF services}}
    facets:
      - {id: ServiceGeneral, label: General, fieldGroup: General}
    fieldGroups:
      General: [Path, Kind, Text, HandlerName, Pack]
  Service/Path: {label: Path}
  Service/Kind: {label: Kind}
  Service/Text: {label: Name}
  Service/HandlerName: {label: Handler}
  Service/Pack: {label: Pack}

  Pack:
    header: {typeName: Pack, typeNamePlural: Packs, title: Name, description: Description}
    selectionFields: [Name]
    lineItem:
      - {value: Name, label: Pack}
      - {value: Objects, label: Objects}
      - {value: Description, label: Description}
    facets:
      - {id: PackGeneral, label: General, fieldGroup: General}
    fieldGroups:
      General: [Name, PackOrder, Objects, Folders, Description]
  Pack/Name: {label: Pack}
  Pack/PackOrder: {label: Order}
  Pack/Objects: {label: Objects}
  Pack/Folders: {label: Folders}
  Pack/Description: {label: Description}

  Database:
    header: {typeName: Environment fact, typeNamePlural: Environment facts, title: Name, description: Value}
    selectionFields: [Category, Name]
    lineItem:
      - {value: Category, label: Category}
      - {value: Name, label: Fact}
      - {value: Value, label: Value}
      - {value: Note, label: Note}
    facets:
      - {id: DatabaseGeneral, label: General, fieldGroup: General}
    fieldGroups:
      General: [Category, Name, Value, Note]
  Database/Category: {label: Category}
  Database/Name: {label: Fact}
  Database/Value: {label: Value}
  Database/Note: {label: Note}

  AmdpMethod:
    header: {typeName: AMDP method, typeNamePlural: AMDP methods, title: MethodName, description: Engine}
    selectionFields: [ClassName, Engine]
    lineItem:
      - {value: ClassName, label: Class}
      - {value: MethodName, label: Method}
      - {value: Kind, label: Kind}
      - {value: Engine, label: Engine}
      - {value: Reason, label: Reason}
    facets:
      - {id: AmdpGeneral, label: General, fieldGroup: General}
    fieldGroups:
      General: [ClassName, MethodName, Kind, Portable, Engine, Reason, Refusal]
  AmdpMethod/ClassName: {label: Class}
  AmdpMethod/MethodName: {label: Method}
  AmdpMethod/Kind: {label: Kind}
  AmdpMethod/Portable: {label: Portable subset}
  AmdpMethod/Engine: {label: Engine}
  AmdpMethod/Reason: {label: Reason}
  AmdpMethod/Refusal: {label: Portable refusal}
